name: Sync Upstream

# Keeps the fork in sync with HackTricks-wiki/hacktricks (master stays a
# clean mirror: this workflow merges upstream into master, keeping the
# fork-maintenance workflows from this fork intact).

on:
  schedule:
    - cron: '17 4 * * *'  # daily at 04:17 UTC (off-peak)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream/master
        run: |
          git remote add upstream https://github.com/HackTricks-wiki/hacktricks.git
          git fetch upstream master
          git merge upstream/master --no-edit -m "Sync upstream/master"
          git push origin master
          echo "Synced to $(git rev-parse --short upstream/master)"
